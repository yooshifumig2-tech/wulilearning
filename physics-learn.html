<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#e56b31"><title>第九章任务式学习｜FUMI 学习轨迹</title><link rel="stylesheet" href="assets/shared.css?v=20260806-1"><link rel="stylesheet" href="assets/dolly-physics.css?v=20260806-1"></head>
<body data-subject="physics"><header class="site-nav"><div class="shell nav-inner"><a class="logo" href="index.html"><span class="logo-mark">F</span><span>FUMI PHYSICS</span></a><nav class="nav-links"><a href="index.html">导航页</a><a href="FUMI_teacher_physics.html">物理测验</a><a class="active" href="physics-learn.html">任务学习</a><a href="physics-practice.html">章节练习</a><a href="learning-map.html">学习档案</a></nav><span class="save-state" data-save-state>仅保存在本设备</span></div></header>
<main class="page"><div class="shell"><section class="workspace-head"><div><p class="eyebrow">GUIDED INQUIRY · 带着问题学</p><h1>第九章 静电场及其应用</h1><p>先领取任务，再依次完成四节探究。内容依据人教版教材与4份导学案重新组织。</p></div><div style="min-width:250px"><div class="muted">学习进度 <b data-progress-text>0 / 5</b></div><div class="progress-line" style="margin-top:9px"><i data-progress style="width:0"></i></div></div></section><div class="workspace"><aside class="side-rail card"><p class="side-title">LEARNING ROUTE</p><div class="rail-list" data-rail></div><div class="notice" style="margin-top:16px">每一页先回答“思考”，再看知识卡；完成小检查后才记录本节完成。</div></aside><section class="stage-shell" data-stage></section></div></div></main>
<script src="assets/physics-data.js?v=20260806-1"></script><script src="assets/shared.js?v=20260806-1"></script><script src="assets/media-bundle.js?v=20260806-1"></script><script src="assets/physics-guide-data.js?v=20260806-1"></script><script>
(()=>{"use strict";const G=window.PHYSICS_GUIDE,S=window.FUMI_STORE,KEY="fumi-physics-guided-v1";let state={current:0,tasks:{},notes:{},checks:{},done:{}};try{state={...state,...JSON.parse(localStorage.getItem(KEY)||"{}")}}catch{}const save=()=>{localStorage.setItem(KEY,JSON.stringify(state));renderRail();progress()};const esc=S.esc;
function progress(){const n=G.filter(x=>state.done[x.id]).length;document.querySelector("[data-progress-text]").textContent=`${n} / ${G.length}`;document.querySelector("[data-progress]").style.width=`${n/G.length*100}%`}
function renderRail(){document.querySelector("[data-rail]").innerHTML=G.map((x,i)=>`<button class="rail-btn ${i===state.current?"active":""} ${state.done[x.id]?"done":""}" data-go="${i}"><span class="rail-index">${state.done[x.id]?"✓":i+1}</span><span><b>${x.code} ${x.title}</b><small>${x.minutes}分钟 · ${x.type==="tasks"?"学习任务":"探究学习"}</small></span></button>`).join("");document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{state.current=Number(b.dataset.go);save();renderStage();scrollTo({top:0,behavior:"smooth"})})}
function taskStage(x){return`<article class="stage-card"><div class="stage-meta"><span class="tag orange">STEP 0</span><span class="tag">先想后学</span></div><h1>${x.title}</h1><p class="task-intro">${x.intro}</p><div class="task-grid">${x.tasks.map(t=>`<article class="task-card"><label><input type="checkbox" data-task="${t.id}" ${state.tasks[t.id]?"checked":""}><span><b>${t.chapter} · ${t.title}</b><p>${t.question}</p></span></label></article>`).join("")}</div><div class="thinking-box"><b>写下本章最想解决的问题</b><textarea data-note="tasks" placeholder="例如：为什么导体内部场强最终会变成0？">${esc(state.notes.tasks||"")}</textarea></div><div class="stage-actions"><span></span><button class="btn primary" data-finish="tasks">带着任务开始学习 →</button></div></article>`}
function lessonStage(x){const answered=state.checks[x.id],src=window.FUMI_MEDIA?.[x.image]||x.image;return`<article class="stage-card"><div class="stage-meta"><span class="tag">${x.code}</span><span class="tag orange">${x.minutes} MIN</span><span class="tag green">导学案重构</span></div><h1>${x.title}</h1><p class="task-intro"><b>本节目标：</b>${x.goal}</p><h2>先想一想</h2><p class="question-prompt">${x.question}</p><div class="thinking-box"><b>学习前的判断</b><p>${x.think}</p><textarea data-note="${x.id}" placeholder="先写下自己的推理，再继续学习……">${esc(state.notes[x.id]||"")}</textarea></div><div class="guide-visual"><img src="${src}" alt="${x.code}导学案原图"></div><h2>带着问题梳理</h2><div class="concept-grid">${x.concepts.map(c=>`<article class="concept-card"><b>${c.title}</b><p>${c.text}</p></article>`).join("")}</div><div class="formula-card">${x.formula}</div><section class="learn-check"><span class="tag orange">CHECK · 即时检查</span><p class="question-prompt" style="font-size:16px">${x.check.prompt}</p><div class="choice-list">${x.check.options.map((o,i)=>`<button class="choice ${answered===i?"selected":""} ${state.done[x.id]&&i===x.check.answer?"correct":""} ${state.done[x.id]&&answered===i&&i!==x.check.answer?"wrong":""}" data-choice="${i}">${String.fromCharCode(65+i)}. ${o}</button>`).join("")}</div>${state.done[x.id]?`<div class="feedback-panel"><div class="answer-line">正确答案：${String.fromCharCode(65+x.check.answer)}</div><p>${x.check.explain}</p></div>`:""}</section><div class="stage-actions"><button class="btn" data-prev>← 上一步</button><button class="btn primary" data-submit="${x.id}">${state.done[x.id]?"已完成 · 进入下一节":"提交检查并完成本节"}</button></div></article>`}
function renderStage(){const x=G[state.current];document.querySelector("[data-stage]").innerHTML=x.type==="tasks"?taskStage(x):lessonStage(x);document.querySelectorAll("[data-task]").forEach(el=>el.onchange=()=>{state.tasks[el.dataset.task]=el.checked;save()});document.querySelectorAll("[data-note]").forEach(el=>el.oninput=()=>{state.notes[el.dataset.note]=el.value;save()});document.querySelectorAll("[data-choice]").forEach(el=>el.onclick=()=>{state.checks[x.id]=Number(el.dataset.choice);save();renderStage()});document.querySelector("[data-prev]")?.addEventListener("click",()=>{state.current=Math.max(0,state.current-1);save();renderStage()});document.querySelector("[data-finish]")?.addEventListener("click",()=>{if(Object.values(state.tasks).filter(Boolean).length<2){S.toast("请先勾选至少2项学习任务");return}state.done.tasks=true;S.upsert({id:"guide-tasks",subject:"physics",chapter:"第九章",point:"学习任务",type:"lesson",completed:true});state.current=1;save();renderStage();scrollTo({top:0,behavior:"smooth"})});document.querySelector("[data-submit]")?.addEventListener("click",()=>{if(state.done[x.id]){state.current=Math.min(G.length-1,state.current+1);save();renderStage();return}if(state.checks[x.id]===undefined){S.toast("请先完成即时检查");return}state.done[x.id]=true;S.upsert({id:`guide-${x.id}`,subject:"physics",chapter:x.code,point:x.title,type:"lesson",completed:true,correct:state.checks[x.id]===x.check.answer});save();renderStage();S.toast(state.checks[x.id]===x.check.answer?"判断正确，已同步学习证据":"已提交；请结合解析修正原判断")})}
window.FUMI_AI_CONTEXT=()=>{const x=G[state.current];return{subject:"physics",page:"第九章任务式学习",chapter:x.code,chapterId:x.code,question:x.type==="tasks"?"本章学习任务":x.question,studentNote:state.notes[x.id]||"",submitted:x.type==="lesson"&&!!state.done[x.id],canReveal:x.type==="lesson"&&!!state.done[x.id],purpose:"tutor"}};renderRail();renderStage();progress()})();
</script></body></html>
