<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#e56b31"><title>第九章任务式学习｜FUMI 学习轨迹</title><link rel="stylesheet" href="assets/shared.css?v=20260806-6"><link rel="stylesheet" href="assets/dolly-physics.css?v=20260806-6"></head>
<body data-subject="physics"><header class="site-nav"><div class="shell nav-inner"><a class="logo" href="index.html"><span class="logo-mark">F</span><span>FUMI PHYSICS</span></a><nav class="nav-links"><a href="index.html">导航页</a><a href="FUMI_teacher_physics.html">物理测验</a><a class="active" href="physics-learn.html">任务学习</a><a href="physics-practice.html">章节练习</a><a href="learning-map.html">学习档案</a></nav><span class="save-state" data-save-state>仅保存在本设备</span></div></header>
<main class="page"><div class="shell"><section class="workspace-head"><div><p class="eyebrow">GUIDED INQUIRY · 带着问题学</p><h1>第九章 静电场及其应用</h1><p>先领取任务，再依次完成四节探究。内容依据人教版教材与4份导学案重新组织。</p></div><div style="min-width:250px"><div class="muted">学习进度 <b data-progress-text>0 / 5</b></div><div class="progress-line" style="margin-top:9px"><i data-progress style="width:0"></i></div></div></section><div class="workspace"><aside class="side-rail card"><p class="side-title">LEARNING ROUTE</p><div class="rail-list" data-rail></div><div class="notice" style="margin-top:16px">每一页先回答“思考”，再看知识卡；完成小检查后才记录本节完成。</div></aside><section class="stage-shell" data-stage></section></div></div></main>
<script src="assets/physics-data.js?v=20260806-6"></script><script src="assets/shared.js?v=20260806-6"></script><script src="assets/media-bundle.js?v=20260806-6"></script><script src="assets/physics-guide-data.js?v=20260806-6"></script><script>
(()=>{"use strict";const G=window.PHYSICS_GUIDE,H=window.PHYSICS_HONORS||{},S=window.FUMI_STORE,KEY="fumi-physics-guided-v1";let state={current:0,tasks:{},notes:{},checks:{},done:{},variantNotes:{},variantOpen:{},variantSteps:{},variantChoices:{}};try{state={...state,...JSON.parse(localStorage.getItem(KEY)||"{}")}}catch{}const save=()=>{localStorage.setItem(KEY,JSON.stringify(state));renderRail();progress()};const esc=S.esc;
function progress(){const n=G.filter(x=>state.done[x.id]).length;document.querySelector("[data-progress-text]").textContent=`${n} / ${G.length}`;document.querySelector("[data-progress]").style.width=`${n/G.length*100}%`}
function renderRail(){document.querySelector("[data-rail]").innerHTML=G.map((x,i)=>`<button class="rail-btn ${i===state.current?"active":""} ${state.done[x.id]?"done":""}" data-go="${i}"><span class="rail-index">${state.done[x.id]?"✓":i+1}</span><span><b>${x.code} ${x.title}</b><small>${x.minutes}分钟 · ${x.type==="tasks"?"学习任务":"探究学习"}</small></span></button>`).join("");document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{state.current=Number(b.dataset.go);save();renderStage();scrollTo({top:0,behavior:"smooth"})})}
function taskStage(x){return`<article class="stage-card"><div class="stage-meta"><span class="tag orange">STEP 0</span><span class="tag">先想后学</span></div><h1>${x.title}</h1><p class="task-intro">${x.intro}</p><div class="task-grid">${x.tasks.map(t=>`<article class="task-card"><label><input type="checkbox" data-task="${t.id}" ${state.tasks[t.id]?"checked":""}><span><b>${t.chapter} · ${t.title}</b><p>${t.question}</p></span></label></article>`).join("")}</div><div class="thinking-box"><b>写下本章最想解决的问题</b><textarea data-note="tasks" placeholder="例如：为什么导体内部场强最终会变成0？">${esc(state.notes.tasks||"")}</textarea></div><div class="stage-actions"><span></span><button class="btn primary" data-finish="tasks">带着任务开始学习 →</button></div></article>`}
function variantCard(v,x){const open=!!state.variantOpen[v.id],step=Math.min(state.variantSteps[v.id]||0,v.steps.length-1),picked=state.variantChoices[v.id],chosen=i=>v.multi?Array.isArray(picked)&&picked.includes(i):picked===i,correct=i=>Array.isArray(v.correct)?v.correct.includes(i):v.correct===i;return`<article class="variant-card ${open?"revealed":""}"><div class="variant-top"><b>${v.title}</b><small>${open?"解析已同步":"先作答"}</small></div>${v.image?`<div class="variant-image"><img src="${v.image}" alt="${v.title}原题图"></div>`:""}<div class="question-ai-row"><p class="variant-prompt">${v.prompt}</p><button class="ask-ai-btn" data-ask-variant="${v.id}">✦ 问 FUMI AI</button></div>${v.multi?`<p class="multi-hint">多选题 · 可选择多个答案</p>`:""}${v.options?`<div class="variant-options">${v.options.map((o,i)=>`<button class="choice ${chosen(i)?"selected":""} ${open&&correct(i)?"correct":""} ${open&&chosen(i)&&!correct(i)?"wrong":""}" data-vchoice="${v.id}" data-index="${i}" data-multi="${v.multi?1:0}" ${open?"disabled":""}>${String.fromCharCode(65+i)}. ${o}</button>`).join("")}</div>`:""}<textarea class="answer-input" data-vnote="${v.id}" placeholder="${v.options?"补充写下判断依据（选填）":"写下现象、受力图思路或关键公式……"}">${esc(state.variantNotes[v.id]||"")}</textarea>${open?`<div class="variant-solution"><div class="answer-line">结论：${v.answer}</div><div class="solution-step-card"><em>STEP ${step+1}/${v.steps.length}</em><p>${v.steps[step]}</p></div><div class="solution-controls"><button class="btn" data-vprev="${v.id}" ${step===0?"disabled":""}>← 上一步</button><div class="step-dots">${v.steps.map((_,i)=>`<i class="${i<=step?"on":""}"></i>`).join("")}</div><button class="btn primary" data-vnext="${v.id}" ${step===v.steps.length-1?"disabled":""}>下一步 →</button></div><p class="mistake-line"><b>易错提醒：</b>${v.mistake}</p></div>`:`<button class="btn primary reveal-variant" data-vreveal="${v.id}" data-chapter="${x.code}">提交作答并看分步解析</button>`}</article>`}
function honorsBlock(x){const h=H[x.id];if(!h)return"";return`<section class="honors-section"><div class="honors-heading"><span class="tag orange">高效培优讲义</span><h2>深化点拨</h2><p>从基础概念推进到判断条件、模型边界与易错点。</p></div><div class="deepen-list">${h.deepens.map((d,i)=>`<details class="deepen-card" ${i===0?"open":""}><summary><i>${String(i+1).padStart(2,"0")}</i><b>${d.title}</b><span>展开</span></summary><p>${d.text}</p></details>`).join("")}</div><div class="honors-heading variant-heading"><span class="tag green">TRANSFER · 迁移</span><h2>变式挑战</h2><p>先写判断依据，再展开分步解析；完成情况自动进入学习档案。</p></div><div class="variant-list">${h.variants.map(v=>variantCard(v,x)).join("")}</div></section>`}
function lessonStage(x){const answered=state.checks[x.id],src=window.FUMI_MEDIA?.[x.image]||x.image;return`<article class="stage-card"><div class="stage-meta"><span class="tag">${x.code}</span><span class="tag orange">${x.minutes} MIN</span><span class="tag green">导学案 + 高效培优</span></div><h1>${x.title}</h1><p class="task-intro"><b>本节目标：</b>${x.goal}</p><h2>先想一想</h2><div class="question-ai-row"><p class="question-prompt">${x.question}</p><button class="ask-ai-btn" data-ask-main="${x.id}">✦ 问 FUMI AI</button></div><div class="thinking-box"><b>学习前的判断</b><p>${x.think}</p><textarea data-note="${x.id}" placeholder="先写下自己的推理，再继续学习……">${esc(state.notes[x.id]||"")}</textarea></div><div class="guide-visual"><img src="${src}" alt="${x.code}导学案原图"></div><h2>带着问题梳理</h2><div class="concept-grid">${x.concepts.map(c=>`<article class="concept-card"><b>${c.title}</b><p>${c.text}</p></article>`).join("")}</div><div class="formula-card">${x.formula}</div>${honorsBlock(x)}<section class="learn-check"><span class="tag orange">CHECK · 即时检查</span><div class="question-ai-row"><p class="question-prompt" style="font-size:16px">${x.check.prompt}</p><button class="ask-ai-btn" data-ask-check="${x.id}">✦ 问 FUMI AI</button></div><div class="choice-list">${x.check.options.map((o,i)=>`<button class="choice ${answered===i?"selected":""} ${state.done[x.id]&&i===x.check.answer?"correct":""} ${state.done[x.id]&&answered===i&&i!==x.check.answer?"wrong":""}" data-choice="${i}">${String.fromCharCode(65+i)}. ${o}</button>`).join("")}</div>${state.done[x.id]?`<div class="feedback-panel"><div class="answer-line">正确答案：${String.fromCharCode(65+x.check.answer)}</div><p>${x.check.explain}</p></div>`:""}</section><div class="stage-actions"><button class="btn" data-prev>← 上一步</button><button class="btn primary" data-submit="${x.id}">${state.done[x.id]?"已完成 · 进入下一节":"提交检查并完成本节"}</button></div></article>`}
function renderStage(){const x=G[state.current];document.querySelector("[data-stage]").innerHTML=x.type==="tasks"?taskStage(x):lessonStage(x);document.querySelectorAll("[data-task]").forEach(el=>el.onchange=()=>{state.tasks[el.dataset.task]=el.checked;save()});document.querySelectorAll("[data-note]").forEach(el=>el.oninput=()=>{state.notes[el.dataset.note]=el.value;save()});document.querySelectorAll("[data-ask-main]").forEach(el=>el.onclick=()=>{window.FUMI_AI_OPEN({subject:"physics",page:"第九章任务学习",chapter:x.code,chapterId:x.code,question:x.question,studentAnswer:state.notes[x.id]||"",submitted:!!state.done[x.id],canReveal:!!state.done[x.id],purpose:"tutor"},"请帮我梳理这道思考题，先给我第一步提示。")});document.querySelectorAll("[data-ask-check]").forEach(el=>el.onclick=()=>{window.FUMI_AI_OPEN({subject:"physics",page:"第九章任务学习",chapter:x.code,chapterId:x.code,question:x.check.prompt,options:x.check.options,studentAnswer:state.checks[x.id],submitted:!!state.done[x.id],canReveal:!!state.done[x.id],purpose:"tutor"},"请根据我当前的选择提示我下一步怎么判断。")});document.querySelectorAll("[data-ask-variant]").forEach(el=>el.onclick=()=>{const v=H[x.id].variants.find(a=>a.id===el.dataset.askVariant);window.FUMI_AI_OPEN({subject:"physics",page:"高效培优变式",chapter:x.code,chapterId:x.code,question:v.prompt,options:v.options?.map(o=>o.replace(/<[^>]+>/g,"[公式]")),studentAnswer:v.options?state.variantChoices[v.id]:state.variantNotes[v.id],submitted:!!state.variantOpen[v.id],canReveal:!!state.variantOpen[v.id],knowledgePoint:v.title,purpose:"tutor"},"我正在看这道变式，请先判断我应该从哪个物理过程或模型开始。")});document.querySelectorAll("[data-vchoice]").forEach(el=>el.onclick=()=>{const id=el.dataset.vchoice,i=Number(el.dataset.index);if(el.dataset.multi==="1"){const a=Array.isArray(state.variantChoices[id])?[...state.variantChoices[id]]:[];state.variantChoices[id]=a.includes(i)?a.filter(n=>n!==i):[...a,i]}else state.variantChoices[id]=i;save();renderStage()});document.querySelectorAll("[data-vnote]").forEach(el=>el.oninput=()=>{state.variantNotes[el.dataset.vnote]=el.value;localStorage.setItem(KEY,JSON.stringify(state))});document.querySelectorAll("[data-vreveal]").forEach(el=>el.onclick=()=>{const id=el.dataset.vreveal;const v=Object.values(H).flatMap(h=>h.variants).find(a=>a.id===id);if(v?.options&&(state.variantChoices[id]===undefined||(Array.isArray(state.variantChoices[id])&&!state.variantChoices[id].length))){S.toast(v.multi?"请至少选择一个答案":"请先选择一个答案");return}if(!v?.options&&!(state.variantNotes[id]||"").trim()){S.toast("请先写一句判断依据或关键公式");return}state.variantOpen[id]=true;state.variantSteps[id]=0;S.upsert({id:`honors-${id}`,subject:"physics",chapter:el.dataset.chapter,point:"培优变式",type:"lesson",completed:true,note:state.variantNotes[id]});save();renderStage()});document.querySelectorAll("[data-vnext]").forEach(el=>el.onclick=()=>{state.variantSteps[el.dataset.vnext]=(state.variantSteps[el.dataset.vnext]||0)+1;save();renderStage()});document.querySelectorAll("[data-vprev]").forEach(el=>el.onclick=()=>{state.variantSteps[el.dataset.vprev]=Math.max(0,(state.variantSteps[el.dataset.vprev]||0)-1);save();renderStage()});document.querySelectorAll("[data-choice]").forEach(el=>el.onclick=()=>{state.checks[x.id]=Number(el.dataset.choice);save();renderStage()});document.querySelector("[data-prev]")?.addEventListener("click",()=>{state.current=Math.max(0,state.current-1);save();renderStage()});document.querySelector("[data-finish]")?.addEventListener("click",()=>{if(Object.values(state.tasks).filter(Boolean).length<2){S.toast("请先勾选至少2项学习任务");return}state.done.tasks=true;S.upsert({id:"guide-tasks",subject:"physics",chapter:"第九章",point:"学习任务",type:"lesson",completed:true});state.current=1;save();renderStage();scrollTo({top:0,behavior:"smooth"})});document.querySelector("[data-submit]")?.addEventListener("click",()=>{if(state.done[x.id]){state.current=Math.min(G.length-1,state.current+1);save();renderStage();return}if(state.checks[x.id]===undefined){S.toast("请先完成即时检查");return}state.done[x.id]=true;S.upsert({id:`guide-${x.id}`,subject:"physics",chapter:x.code,point:x.title,type:"lesson",completed:true,correct:state.checks[x.id]===x.check.answer});save();renderStage();S.toast(state.checks[x.id]===x.check.answer?"判断正确，已同步学习证据":"已提交；请结合解析修正原判断")})}
window.FUMI_AI_CONTEXT=()=>{const x=G[state.current];return{subject:"physics",page:"第九章任务式学习",chapter:x.code,chapterId:x.code,question:x.type==="tasks"?"本章学习任务":x.question,studentNote:state.notes[x.id]||"",submitted:x.type==="lesson"&&!!state.done[x.id],canReveal:x.type==="lesson"&&!!state.done[x.id],purpose:"tutor"}};renderRail();renderStage();progress()})();
</script></body></html>
