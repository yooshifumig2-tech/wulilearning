<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#e56b31"><title>第九章章节复习｜FUMI 学习轨迹</title><link rel="stylesheet" href="assets/shared.css?v=20260806-6"><link rel="stylesheet" href="assets/dolly-physics.css?v=20260806-6"></head>
<body data-subject="physics"><header class="site-nav"><div class="shell nav-inner"><a class="logo" href="index.html"><span class="logo-mark">F</span><span>FUMI PHYSICS</span></a><nav class="nav-links"><a href="index.html">导航页</a><a href="FUMI_teacher_physics.html">物理测验</a><a href="physics-learn.html">任务学习</a><a class="active" href="physics-practice.html">章节练习</a><a href="learning-map.html">学习档案</a></nav><span class="save-state" data-save-state>仅保存在本设备</span></div></header>
<main class="practice-layout"><aside class="practice-sidebar"><p class="eyebrow">CHAPTER REVIEW</p><h2 style="margin:0">第九章基础达标练</h2><p class="muted">18题 · 90分钟原卷 · 提交后逐步解析</p><div style="margin:18px 0"><div class="muted">完成进度 <b data-count>0 / 18</b></div><div class="progress-line" style="margin-top:8px"><i data-bar style="width:0"></i></div></div><div class="filterGroup"><p class="side-title">题型筛选</p><div class="chips" data-filters></div></div><div class="question-nav" data-nav></div><div class="notice" style="margin-top:18px">题目与原图来自《第九章 静电场及其应用 章节复习（基础达标练）》；提交前不显示答案。</div></aside><section class="practice-main"><div class="practice-wrap"><div data-question></div></div></section></main>
<script src="assets/physics-data.js?v=20260811-1"></script><script src="assets/physics-analysis.js?v=20260811-1"></script><script src="assets/physics-diagrams.js?v=20260811-1"></script><script src="assets/review-diagrams.js?v=20260811-1"></script><script src="assets/shared.js?v=20260811-1"></script><script src="assets/media-bundle.js?v=20260811-1"></script><script src="assets/review-questions.js?v=20260811-1"></script><script>
(()=>{"use strict";const Q=window.REVIEW_QUESTIONS,S=window.FUMI_STORE,KEY="fumi-review-20260806";let state={index:0,answers:{},submitted:{},step:{},filter:"全部"};try{state={...state,...JSON.parse(localStorage.getItem(KEY)||"{}")}}catch{}const esc=S.esc;const save=()=>{localStorage.setItem(KEY,JSON.stringify(state));updateSide()};const shown=()=>Q.filter(q=>state.filter==="全部"||q.section===state.filter);const current=()=>shown()[Math.min(state.index,shown().length-1)];const same=(a,b)=>JSON.stringify([...(a||[])].sort())===JSON.stringify([...(b||[])].sort());const chapter=q=>["r1","r2","r14","r15"].includes(q.id)?"9.1":["r4","r6","r8","r13","r16","r17"].includes(q.id)?"9.2":["r3","r5","r7","r10","r18"].includes(q.id)?"9.3":"9.4";
function updateSide(){const done=Object.keys(state.submitted).length;document.querySelector("[data-count]").textContent=`${done} / ${Q.length}`;document.querySelector("[data-bar]").style.width=`${done/Q.length*100}%`;document.querySelector("[data-filters]").innerHTML=["全部",...new Set(Q.map(q=>q.section))].map(f=>`<button class="chip ${state.filter===f?"active":""}" data-filter="${f}">${f}</button>`).join("");document.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{state.filter=b.dataset.filter;state.index=0;save();render()});document.querySelector("[data-nav]").innerHTML=shown().map((q,i)=>`<button class="${i===state.index?"active":""} ${state.submitted[q.id]?"done":""}" data-jump="${i}">${Q.indexOf(q)+1}</button>`).join("");document.querySelectorAll("[data-jump]").forEach(b=>b.onclick=()=>{state.index=Number(b.dataset.jump);save();renderQuestion()})}
function media(src){return window.FUMI_MEDIA?.[src]||src}function mediaHtml(html){return html.replace(/assets\/(?:review|guides)\/[^'\" ]+/g,x=>media(x))}function visuals(q){if(!q.visual)return"";const imgs=q.visual.split("|");return`<div class="original-figure-label">原题图 · 与复习讲义逐题核对</div><div class="practice-visual" style="grid-template-columns:repeat(${Math.min(imgs.length,2)},1fr);gap:10px">${imgs.map((src,i)=>`<img src="${media(src)}" alt="题目${Q.indexOf(q)+1}原图${i+1}">`).join("")}</div>`}
function optionArea(q){if(q.type==="text")return`<textarea class="answer-input" data-text placeholder="请写出必要的物理过程、公式和结果……">${esc(state.answers[q.id]?.text||"")}</textarea>`;const selected=state.answers[q.id]?.choice||[];return`<div class="choice-list">${q.options.map((o,i)=>{const sub=state.submitted[q.id],ok=q.answer.includes(i),pick=selected.includes(i);return`<button class="choice ${pick?"selected":""} ${sub&&ok?"correct":""} ${sub&&pick&&!ok?"wrong":""}" data-option="${i}" ${sub?"disabled":""}><span class="choiceKey">${String.fromCharCode(65+i)}</span> ${mediaHtml(o)}</button>`}).join("")}</div>`}
function solution(q){const n=Math.min(state.step[q.id]||0,q.steps.length-1),isText=q.type==="text",correct=!isText&&same(state.answers[q.id]?.choice,q.answer);return`<section class="feedback-panel"><div class="answer-line">${isText?"参考答案":correct?"✓ 回答正确":"✦ 正确答案"}：${isText?q.answerText:q.answer.map(i=>String.fromCharCode(65+i)).join("、")}</div>${window.FUMI_ANALYSIS?.render(q.id,q.steps,q.mistake)||""}${!isText?`<p class="muted">${q.mistake?`典型错因：${q.mistake}`:""}</p>`:""}<div class="solution-player"><div class="solution-stage"><div class="solution-diagram" aria-hidden="true"><span class="vector" style="left:50%;top:62%;width:${70+n*22}px;transform:rotate(${-18+n*18}deg)"></span><span class="vector" style="left:50%;top:62%;width:${55+n*18}px;transform:rotate(${198-n*10}deg);background:var(--blue)"></span></div>${q.steps.map((s,i)=>`<div class="solution-step ${i===n?"show":""}" style="display:${i===n?"block":"none"}"><b>步骤 ${i+1}/${q.steps.length}</b><p>${s}</p></div>`).join("")}</div><div class="solution-controls"><button class="btn small" data-step-prev ${n===0?"disabled":""}>← 上一步</button>${q.steps.map((_,i)=>`<span class="step-dot ${i<=n?"on":""}"></span>`).join("")}<button class="btn small primary" data-step-next ${n===q.steps.length-1?"disabled":""}>下一步 →</button></div></div></section>`}
function renderQuestion(){const q=current(),global=Q.indexOf(q),submitted=state.submitted[q.id];document.querySelector("[data-question]").innerHTML=`<article class="practice-card"><div class="stage-meta"><span class="review-badge">第 ${global+1} / ${Q.length} 题</span><span class="tag">${q.section}</span><span class="tag orange">${q.point}</span><span class="tag green">${q.dimension}</span></div><div class="question-ai-row"><p class="question-prompt">${q.prompt}</p><button class="ask-ai-btn" data-ask-question>✦ 问 FUMI AI</button></div>${visuals(q)}${optionArea(q)}${submitted?solution(q):""}<div class="stage-actions"><button class="btn" data-prev ${state.index===0?"disabled":""}>← 上一题</button>${submitted?`<button class="btn primary" data-next>下一题 →</button>`:`<button class="btn primary" data-submit>提交后查看逐步解析</button>`}</div></article>`;document.querySelector("[data-ask-question]")?.addEventListener("click",()=>{window.FUMI_AI_OPEN({subject:"physics",page:"第九章章节复习",chapter:chapter(q),chapterId:chapter(q),question:q.prompt,options:q.options?.map(o=>o.replace(/<[^>]+>/g,"[公式]")),studentAnswer:state.answers[q.id],knowledgePoint:q.point,dimension:q.dimension,submitted:!!state.submitted[q.id],canReveal:!!state.submitted[q.id],purpose:"tutor"},"我正在做这道题，请先帮我确定研究对象和第一步，不要直接公布答案。")});document.querySelectorAll("[data-option]").forEach(b=>b.onclick=()=>{const i=Number(b.dataset.option),a=state.answers[q.id]?.choice||[];state.answers[q.id]={choice:q.type==="multi"?(a.includes(i)?a.filter(x=>x!==i):[...a,i]):[i]};save();renderQuestion()});document.querySelector("[data-text]")?.addEventListener("input",e=>{state.answers[q.id]={text:e.target.value};save()});document.querySelector("[data-submit]")?.addEventListener("click",()=>{const a=state.answers[q.id];if(!a||(q.type==="text"?!a.text?.trim():!a.choice?.length)){S.toast("请先作答再提交");return}state.submitted[q.id]=true;state.step[q.id]=0;const correct=q.type==="text"?null:same(a.choice,q.answer);S.upsert({id:`review-${q.id}`,subject:"physics",chapter:chapter(q),point:q.point,dimension:q.dimension,type:"question",submitted:true,correct,answer:q.type==="text"?"过程题":a.choice,source:"chapter-review"});save();renderQuestion();S.toast(q.type==="text"?"已提交，按步骤核对过程":correct?"回答正确，开始逐步复盘":"已提交，先定位第一处判断差异")});document.querySelector("[data-step-prev]")?.addEventListener("click",()=>{state.step[q.id]=Math.max(0,(state.step[q.id]||0)-1);save();renderQuestion()});document.querySelector("[data-step-next]")?.addEventListener("click",()=>{state.step[q.id]=Math.min(q.steps.length-1,(state.step[q.id]||0)+1);save();renderQuestion()});document.querySelector("[data-prev]")?.addEventListener("click",()=>{state.index=Math.max(0,state.index-1);save();renderQuestion();scrollTo({top:0,behavior:"smooth"})});document.querySelector("[data-next]")?.addEventListener("click",()=>{state.index=Math.min(shown().length-1,state.index+1);save();renderQuestion();scrollTo({top:0,behavior:"smooth"})});updateSide()}
function render(){updateSide();renderQuestion()}window.FUMI_AI_CONTEXT=()=>{const q=current(),submitted=!!state.submitted[q.id];return{subject:"physics",page:"第九章章节复习",chapter:"第九章",question:q.prompt,options:q.options?.map(o=>o.replace(/<[^>]+>/g,"[公式]")),studentAnswer:state.answers[q.id],knowledgePoint:q.point,submitted,canReveal:submitted,purpose:"tutor"}};render()})();
</script></body></html>
